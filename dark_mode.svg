<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','Menlo','Consolas',monospace" width="985px" height="490px" font-size="14px">
<style>
text, tspan { white-space: pre; }
.key { fill: #ffa657; }
.val { fill: #a5d6ff; }
.dim { fill: #616e7f; }
.hdr { fill: #c9d1d9; font-weight: bold; }
.txt { fill: #c9d1d9; }
.cat { fill: #f0883e; font-weight: 500; }
.pillow { fill: #79c0ff; }
.snore { fill: #a5d6ff; font-weight: bold; }
.sparkle { fill: #e3b341; }

@keyframes float-z1 {
  0% { opacity: 0; transform: translateY(0px) translateX(0px); }
  30% { opacity: 0.9; }
  80% { opacity: 0.4; }
  100% { opacity: 0; transform: translateY(-26px) translateX(-8px); }
}
@keyframes float-z2 {
  0% { opacity: 0; transform: translateY(0px) translateX(0px); }
  30% { opacity: 0.9; }
  80% { opacity: 0.4; }
  100% { opacity: 0; transform: translateY(-30px) translateX(-12px); }
}
@keyframes float-z3 {
  0% { opacity: 0; transform: translateY(0px) translateX(0px); }
  30% { opacity: 0.9; }
  80% { opacity: 0.4; }
  100% { opacity: 0; transform: translateY(-34px) translateX(-16px); }
}
@keyframes float-z4 {
  0% { opacity: 0; transform: translateY(0px) translateX(0px); }
  30% { opacity: 0.9; }
  80% { opacity: 0.4; }
  100% { opacity: 0; transform: translateY(-38px) translateX(-20px); }
}
@keyframes breathe {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-2px); }
}
@keyframes twinkle {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 0.85; }
}

.breathe-cat {
  animation: breathe 3.6s ease-in-out infinite;
}
.z-anim-1 { animation: float-z1 3.6s ease-in-out infinite 0.0s; }
.z-anim-2 { animation: float-z2 3.6s ease-in-out infinite 0.9s; }
.z-anim-3 { animation: float-z3 3.6s ease-in-out infinite 1.8s; }
.z-anim-4 { animation: float-z4 3.6s ease-in-out infinite 2.7s; }
.sparkle-1 { animation: twinkle 2.8s ease-in-out infinite 0s; }
.sparkle-2 { animation: twinkle 3.4s ease-in-out infinite 1.2s; }
</style>

<rect width="985" height="490" fill="#0d1117" rx="12" stroke="#30363d" stroke-width="1"/>

<!-- Cozy background stars -->
<text x="65" y="105" class="sparkle sparkle-1" font-size="12">✦</text>
<text x="290" y="85" class="sparkle sparkle-2" font-size="11">★</text>
<text x="320" y="165" class="sparkle sparkle-1" font-size="10">✦</text>

<!-- Animated Snore Zs rising up from sleeping cat -->
<g class="snore">
  <!-- Small z -->
  <text x="68" y="168" font-size="13" class="snore z-anim-1">
    z
    <animate attributeName="opacity" values="0;0.9;0.5;0" dur="3.6s" repeatCount="indefinite" begin="0.0s"/>
    <animate attributeName="y" values="172;146" dur="3.6s" repeatCount="indefinite" begin="0.0s"/>
    <animate attributeName="x" values="70;62" dur="3.6s" repeatCount="indefinite" begin="0.0s"/>
  </text>
  <!-- Medium z -->
  <text x="54" y="142" font-size="15" class="snore z-anim-2">
    z
    <animate attributeName="opacity" values="0;0.9;0.5;0" dur="3.6s" repeatCount="indefinite" begin="0.9s"/>
    <animate attributeName="y" values="148;118" dur="3.6s" repeatCount="indefinite" begin="0.9s"/>
    <animate attributeName="x" values="58;46" dur="3.6s" repeatCount="indefinite" begin="0.9s"/>
  </text>
  <!-- Large Z -->
  <text x="38" y="114" font-size="18" class="snore z-anim-3">
    Z
    <animate attributeName="opacity" values="0;0.9;0.5;0" dur="3.6s" repeatCount="indefinite" begin="1.8s"/>
    <animate attributeName="y" values="122;88" dur="3.6s" repeatCount="indefinite" begin="1.8s"/>
    <animate attributeName="x" values="44;28" dur="3.6s" repeatCount="indefinite" begin="1.8s"/>
  </text>
  <!-- Extra-large Z -->
  <text x="20" y="82" font-size="22" class="snore z-anim-4">
    Z
    <animate attributeName="opacity" values="0;0.9;0.5;0" dur="3.6s" repeatCount="indefinite" begin="2.7s"/>
    <animate attributeName="y" values="90;52" dur="3.6s" repeatCount="indefinite" begin="2.7s"/>
    <animate attributeName="x" values="26;6" dur="3.6s" repeatCount="indefinite" begin="2.7s"/>
  </text>
</g>

<!-- Sleeping Cat (cat1 enhanced with breathing and cozy cushion) -->
<g class="breathe-cat">
  <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2.5; 0,0" dur="3.6s" repeatCount="indefinite"/>
  <text x="30" y="175" font-size="14.5">
    <tspan x="30" y="175" class="cat">            |\      _,,,---,,_        </tspan>
    <tspan x="30" y="197" class="cat">           /,`.-'`'    -.  ;-;;,      </tspan>
    <tspan x="30" y="219" class="cat">          |,4-  ) )-,_. ,\ (  ''-'    </tspan>
    <tspan x="30" y="241" class="cat">         '---''(_/--'  `-'\_)         </tspan>
  </text>
</g>

<!-- Cozy cushion / resting base -->
<text x="30" y="265" font-size="14">
  <tspan x="30" y="265" class="pillow">     .--------------------------------.  </tspan>
  <tspan x="30" y="285" class="pillow">    (   ~   ~   cozy developer   ~   ~ ) </tspan>
  <tspan x="30" y="305" class="pillow">     '--------------------------------'  </tspan>
  <tspan x="30" y="335" class="dim">               chrollovale@mac           </tspan>
  <tspan x="30" y="358" class="dim">             [ status: sleeping ]        </tspan>
</text>

<!-- Info Block on the right -->
<text x="375" y="55" class="txt">
  <tspan x="375" y="55"  class="hdr">aniket</tspan><tspan class="dim">@</tspan><tspan class="hdr">chrollovale</tspan><tspan class="dim"> ——————————————————————————————————————————</tspan>
  <tspan x="375" y="77"  class="dim">  </tspan><tspan class="key">OS</tspan><tspan class="dim">:</tspan><tspan class="dim"> .......................... </tspan><tspan class="val">macOS (Apple Silicon)</tspan>
  <tspan x="375" y="99"  class="dim">  </tspan><tspan class="key">Shell</tspan><tspan class="dim">:</tspan><tspan class="dim"> ....................... </tspan><tspan class="val">zsh, Swift REPL</tspan>
  <tspan x="375" y="121" class="dim">  </tspan><tspan class="key">IDE</tspan><tspan class="dim">:</tspan><tspan class="dim"> ......................... </tspan><tspan class="val">Xcode, VS Code</tspan>
  <tspan x="375" y="143" class="dim">  </tspan><tspan class="key">Host</tspan><tspan class="dim">:</tspan><tspan class="dim"> ........................ </tspan><tspan class="val">Chandigarh University (B.Tech CSE)</tspan>
  <tspan x="375" y="165" class="dim">  </tspan>
  <tspan x="375" y="187" class="dim">  </tspan><tspan class="key">Languages</tspan><tspan class="dim">.</tspan><tspan class="key">Primary</tspan><tspan class="dim">:</tspan><tspan class="dim"> ......... </tspan><tspan class="val">Swift, JavaScript, TypeScript</tspan>
  <tspan x="375" y="209" class="dim">  </tspan><tspan class="key">Languages</tspan><tspan class="dim">.</tspan><tspan class="key">Secondary</tspan><tspan class="dim">:</tspan><tspan class="dim"> ....... </tspan><tspan class="val">Python, C++, Java, Shell</tspan>
  <tspan x="375" y="231" class="dim">  </tspan><tspan class="key">Languages</tspan><tspan class="dim">.</tspan><tspan class="key">Markup</tspan><tspan class="dim">:</tspan><tspan class="dim"> .......... </tspan><tspan class="val">HTML, CSS, JSON, YAML</tspan>
  <tspan x="375" y="253" class="dim">  </tspan>
  <tspan x="375" y="275" class="dim">  </tspan><tspan class="key">Frameworks</tspan><tspan class="dim">.</tspan><tspan class="key">Apple</tspan><tspan class="dim">:</tspan><tspan class="dim"> ......... </tspan><tspan class="val">SwiftUI, AppKit, Combine, SPM</tspan>
  <tspan x="375" y="297" class="dim">  </tspan><tspan class="key">Frameworks</tspan><tspan class="dim">.</tspan><tspan class="key">Web</tspan><tspan class="dim">:</tspan><tspan class="dim"> ........... </tspan><tspan class="val">Manifest V3, WebExtensions API</tspan>
  <tspan x="375" y="319" class="dim">  </tspan><tspan class="key">Tools</tspan><tspan class="dim">:</tspan><tspan class="dim"> ...................... </tspan><tspan class="val">Git, ADB, Docker, Instruments</tspan>
  <tspan x="375" y="341" class="dim">  </tspan>
  <tspan x="375" y="363" class="dim">— </tspan><tspan class="hdr">GitHub Stats</tspan><tspan class="dim"> —————————————————————————————————————————————</tspan>
  <tspan x="375" y="385" class="dim">  </tspan><tspan class="key">Repos</tspan><tspan class="dim">:</tspan><tspan class="dim"> ........... </tspan><tspan class="val">7</tspan><tspan class="dim"> | </tspan><tspan class="key">Commits</tspan><tspan class="dim">:</tspan><tspan class="dim"> ................. </tspan><tspan class="val">20+</tspan>
  <tspan x="375" y="407" class="dim">  </tspan><tspan class="key">Focus</tspan><tspan class="dim">:</tspan><tspan class="dim"> ........... </tspan><tspan class="val">Native macOS Apps &amp; Browser Extensions</tspan>
  <tspan x="375" y="429" class="dim">  </tspan>
  <tspan x="375" y="451" class="dim">— </tspan><tspan class="hdr">Projects</tspan><tspan class="dim"> —————————————————————————————————————————————————</tspan>
  <tspan x="375" y="473" class="dim">  </tspan><tspan class="val">Shift</tspan><tspan class="dim"> · </tspan><tspan class="val">SlopMonsterMac</tspan><tspan class="dim"> · </tspan><tspan class="val">KeyInjector</tspan><tspan class="dim"> · </tspan><tspan class="val">Master-IDE-Copier</tspan>
</text>
</svg>
